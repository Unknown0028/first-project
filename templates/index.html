<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask To-Do App</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header-bar">
        <h1><i class="fa-solid fa-list-check"></i> My To-Do List</h1>
    </header>
    <div class="center-outer">
      <div class="container">
        <div class="quote-bar">“{{ quote }}”</div>
        <form action="/add" method="post" class="add-form">
            <input type="text" name="title" placeholder="Add a new task..." required>
            <button type="submit" title="Add Task"><i class="fa-solid fa-plus"></i></button>
        </form>
        <ul class="todo-list">
            {% for todo in todos %}
            <li class="todo-item {% if todo.completed %}completed{% endif %}">
                <span>{{ todo.title }}</span>
                <div class="actions">
                    {% if not todo.completed %}
                    <a href="/complete/{{ todo.id }}" class="complete-btn" title="Mark as complete"><i class="fa-solid fa-check"></i></a>
                    {% endif %}
                    <a href="/delete/{{ todo.id }}" class="delete-btn" title="Delete"><i class="fa-solid fa-trash"></i></a>
                </div>
            </li>
            {% endfor %}
        </ul>
      </div>
    </div>
    <footer class="footer-bar">
        <span>Made with <i class="fa-solid fa-heart"></i> using Flask &amp; Vercel</span>
    </footer>
</body>
</html>
