<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Flask To-Do App</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header-bar">
        <h1><i class="fa-solid fa-pen"></i> Edit Task</h1>
        <nav class="nav-bar">
            <a href="/"><i class="fa-solid fa-list-check"></i> To-Do List</a>
        </nav>
    </header>
    <div class="center-outer">
      <div class="container">
        <form action="" method="post" class="add-form">
            <input type="text" name="title" value="{{ todo.title }}" required>
            <input type="text" name="note" value="{{ todo.note }}" placeholder="Edit note (optional)...">
            <input type="date" name="due_date" value="{{ todo.due_date }}">
            <button type="submit" title="Save"><i class="fa-solid fa-floppy-disk"></i> Save</button>
        </form>
      </div>
    </div>
    <footer class="footer-bar">
        <span>Back to <a href="/">To-Do List</a></span>
    </footer>
    <script src="/static/main.js"></script>
</body>
</html>
